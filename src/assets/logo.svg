<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 108" width="440" height="108" role="img" aria-label="Perch">
  <!-- Bird mark. Shifted so its optical centre lines up with the wordmark's. -->
  <g transform="translate(-2 -17) scale(1.28)" fill="currentColor">
    <path fill-rule="evenodd" d="M6 90C20 68 33 45 49 31C56 25 67 21 75 27C78 29 80 31 81 33L97 37L80 45C86 57 86 70 79 79C72 85 63 88 52 88C62 80 70 68 73 54C60 70 46 78 34 80C20 83 11 87 6 90Z"/>
  </g>

  <!-- "perch" — a geometric monoline construction, drawn rather than typeset:
       no geometric grotesque ships with Windows, so a font stack would fall back
       to Segoe UI and lose the look.

       Terminals are cut flat rather than rounded. Round ends read as friendly;
       flat ones read as drawn to a ruler, which is the intent here. Stroke 8
       against a 46 x-height, advances of letter width plus stroke plus 14.

       Baseline y=70, x-height top y=24, ascender y=8, descender y=94. -->
  <g transform="translate(150 3)"
     fill="none" stroke="currentColor" stroke-width="8"
     stroke-linecap="butt" stroke-linejoin="miter">
    <!-- p -->
    <path d="M0 24V94"/>
    <circle cx="23" cy="47" r="23"/>
    <!-- e: bowl opened at 4 o'clock, crossbar meeting it at both sides -->
    <path d="M68 47H114"/>
    <path d="M114 47a23 23 0 1 0 -8.2 17.6"/>
    <!-- r -->
    <path d="M136 24v46"/>
    <path d="M136 40c0-12 8-16 20-16"/>
    <!-- c -->
    <path d="M218.6 32.2a23 23 0 1 0 0 29.6"/>
    <!-- h -->
    <path d="M246 8v62"/>
    <path d="M246 40c0-12 8-16 19-16c11 0 15 7 15 18v28"/>
  </g>
</svg>
