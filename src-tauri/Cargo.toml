[package]
name = "perch"
version = "0.1.5"
edition = "2021"
rust-version = "1.77"
description = "Local desktop file automation tool"
license = "MIT"
authors = ["Fuilex"]

[lib]
name = "perch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
trash = "5"
sha2 = "0.10"
glob = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
dirs = "6"
argon2 = { version = "0.5", features = ["std"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
